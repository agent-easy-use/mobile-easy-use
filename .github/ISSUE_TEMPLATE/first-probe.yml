name: First probe feedback / 首次探查反馈
description: Tell us what you tried, what worked, and where you got stuck.
title: "[First probe] "
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - Android
        - iOS
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What did you want to investigate? / 想探查什么问题？
      description: Describe the runtime question or development task.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: How far did you get? / 完成到哪一步？
      options:
        - Installed Skills / 已安装 Skills
        - Integrated and installed the app / 已集成并安装 App
        - Connected through MCP / 已通过 MCP 连接
        - Completed a probe / 已完成一次探查
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Agent, OS/device, MCP version and Runtime release returned by Integrate.
  - type: textarea
    id: result
    attributes:
      label: Result or blocker / 结果或卡点
      description: Include useful output or screenshots after removing credentials and private app data.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where did you find the project? / 从哪里知道这个项目？
      description: Optional; helps us understand which documentation and channels are useful.
